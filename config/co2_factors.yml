# Carbon methodology — emission factors per indicator unit.
#
# These are the same coefficients that were hard-coded in the Power BI
# calculated columns (Absorbed_Res1 / Avoided_Res1 / Absorbed_Tar1), moved
# here so that a methodology change is a reviewed edit to this file rather
# than a DAX change.
#
#   rate     : tCO2e per unit (ha or item) per year
#   horizon  : number of years the benefit is counted over
#   formula  : how `rate` was derived (shown on the dashboard's methodology page)
#
# For each programme × indicator the pipeline derives:
#   committed  = latest cumulative result × rate × horizon   (full-cycle benefit
#                of what is in place; equals the Power BI "Total_Res1")
#   realised   = Σ over reported years of cumulative result × rate
#                (benefit already accrued up to the selected year)
#   target     = final target × rate × horizon
#
# Keys are standard indicator codes (config/reference workbook, CARBON tag).
#
# Changes vs. the Power BI report (please confirm with the M&E team):
#   * Targets now use the same horizon as results. Power BI used 4 years
#     (01), 9 years (02/03) and 5 years (05) for targets but 10 years for
#     results, so results and targets were not comparable.
#   * Forest conservation (13) is now counted for results. Power BI only
#     had a target formula, so its CO2 result was always 0.
#   * Clean cooking (05) and forest conservation (13) are classed as
#     *avoided* emissions (less fuelwood burnt / deforestation prevented).
#     Power BI put them under "absorbed".

factors:
  AGR-01:   # subsistence / improved food crops (old 01)
    - component: absorbed
      rate: 2.9336          # 0.8 × 3.667
      horizon: 10
      formula: "0.8 tC/ha/yr sequestration × 3.667 (C → CO2)"
    - component: avoided
      rate: 1.4668          # 0.8 × 3.667 × 0.5
      horizon: 10
      formula: "0.8 tC/ha/yr × 3.667 × 50 % of area"
  AGR-02:   # perennial crops (old 02)
    - component: absorbed
      rate: 23.13877        # (5.09 + 1.22) × 3.667
      horizon: 10
      formula: "(5.09 + 1.22) tC/ha/yr (above + below ground) × 3.667"
    - component: avoided
      rate: 11.569385       # (5.09 + 1.22) × 3.667 × 0.5
      horizon: 10
      formula: "(5.09 + 1.22) tC/ha/yr × 3.667 × 50 % of area"
  AGR-03:   # agroforestry (old 03)
    - component: absorbed
      rate: 23.13877
      horizon: 10
      formula: "(5.09 + 1.22) tC/ha/yr (above + below ground) × 3.667"
    - component: avoided
      rate: 11.569385
      horizon: 10
      formula: "(5.09 + 1.22) tC/ha/yr × 3.667 × 50 % of area"
  FOR-02:   # tree plantations / reforestation (same coefficients as old 02/03)
    - component: absorbed
      rate: 23.13877
      horizon: 10
      formula: "(5.09 + 1.22) tC/ha/yr (above + below ground) × 3.667"
    - component: avoided
      rate: 11.569385
      horizon: 10
      formula: "(5.09 + 1.22) tC/ha/yr × 3.667 × 50 % of area"
  FOR-01:   # natural regeneration of savannah (old 04)
    - component: absorbed
      rate: 2.4477225       # (0.62 + 19 × 0.25 %) × 3.667
      horizon: 15
      formula: "(0.62 + 19 × 0.25 %) tC/ha/yr × 3.667"
    - component: avoided
      rate: 0.0122386125    # (0.62 + 19 × 0.25 %) × 3.667 × 0.5 %
      horizon: 15
      formula: "(0.62 + 19 × 0.25 %) tC/ha/yr × 3.667 × 0.5 % of area"
  ENR-01:   # clean cooking solutions (old 05)
    - component: avoided
      rate: 3.65701875      # 5.5 × 2.533 × 0.75 × 0.35
      horizon: 10
      formula: "5.5 t fuelwood/stove/yr × 2.533 tCO2/t × 75 % use × 35 % savings"
  FOR-04:   # forest conservation (old 13)
    - component: avoided
      rate: 1.25            # 0.25 % × 500
      horizon: 15
      formula: "0.25 %/yr baseline deforestation × 500 tCO2/ha"
