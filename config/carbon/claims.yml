# Claims register: who else accounts for the results of an MPTF project.
# Prevents the same tonne being presented twice as additional.
#
#   status: cafi_contribution   (default when a project is not listed)
#           national_programme  counted in a host-country ER programme / FREL
#           corporate_inventory reported in a company's Scope 3 inventory
#           inset_unit          issued as a verified inset unit
#           credit              issued as a carbon credit (registry, serials)
#           article6            transferred with corresponding adjustment
#
# Keyed by MPTF project id. "confirm: true" = status to be verified.

103850:
