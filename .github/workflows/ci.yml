name: CI

# Validates the data and the dashboard on every pull request and push.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    # Pinned: Playwright ships browser dependencies for the LTS images only, and
    # ubuntu-latest moved to 26.04 before Playwright 1.56 supported it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Test pipeline
        run: python -m pytest -q

      - name: Build and validate data
        run: python -m pipeline.build

      - name: Upload data-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality
          path: web/public/data/quality.json
          if-no-files-found: ignore

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck, test and build dashboard
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npx vite build

      - name: Install the smoke-test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the built dashboard (console errors, overflow, axe)
        working-directory: web
        run: npm run smoke
